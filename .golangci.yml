version: "2"

run:
  timeout: 3m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - unused
    - staticcheck
    - bodyclose
    - durationcheck
    - nilerr
  settings:
    staticcheck:
      checks:
        - SA*

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
