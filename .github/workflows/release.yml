name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z)
        required: true
        type: string
      artifact_only:
        description: Build and stage artifacts without creating a GitHub draft
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Verify release revision
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      ARTIFACT_ONLY: ${{ inputs.artifact_only }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the version and CI status
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo "Select main when starting the release workflow." >&2
            exit 1
          }
          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$VERSION" =~ $version_pattern ]] || {
            echo "Enter a version in X.Y.Z format." >&2
            exit 1
          }
          result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow go.yml \
            --branch main --event push --commit "$GITHUB_SHA" --limit 1 \
            --json conclusion --jq '.[0].conclusion')
          [[ "$result" == success ]] || {
            echo "The Go workflow must pass for $GITHUB_SHA before release." >&2
            exit 1
          }
          if [[ "$ARTIFACT_ONLY" != true ]] && gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for v$VERSION already exists." >&2
            exit 1
          fi

  arch:
    name: Build Arch package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and stage checksummed assets
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/arch-build" "$RUNNER_TEMP/arch-release"
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/arch-build,dst=/output" \
            --env "PANORA_RELEASE_VERSION=$VERSION" \
            archlinux@sha256:a1d4b509c51fc68dcc7ee1f88342fe26b1f65e6775c3aff26f196141e6c76a6f \
            bash -euc '
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --needed --noconfirm git go nodejs corepack desktop-file-utils \
                gtk3 webkit2gtk-4.1 socat xdg-utils
              uid=$(stat -c %u /source)
              gid=$(stat -c %g /source)
              getent group "$gid" >/dev/null || groupadd --gid "$gid" builder
              useradd --create-home --uid "$uid" --gid "$gid" builder
              runuser -u builder -- bash -euc "
                cd /source
                packaging/arch/build-release HEAD /output/package
              "
            '
          build="$RUNNER_TEMP/arch-build/package"
          release="$RUNNER_TEMP/arch-release"
          package="panora-$VERSION-1-x86_64.pkg.tar.zst"
          source="panora-$GITHUB_SHA.tar.gz"
          cp "$build/$package" "$build/$source" \
            "$build/PKGBUILD" "$build/RELEASE-RECEIPT.txt" "$build/SHA256SUMS" "$release/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-release
          path: ${{ runner.temp }}/arch-release
          if-no-files-found: error
          compression-level: 0

  macos:
    name: Build Apple silicon preview
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.1"
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - name: Build and verify the extracted preview
        shell: bash
        run: |
          [[ "$(uname -m)" == arm64 ]]
          python3 packaging/macos/build-release.py "$GITHUB_SHA" "$VERSION" "$RUNNER_TEMP/macos-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release
          path: ${{ runner.temp }}/macos-release
          if-no-files-found: error
          compression-level: 0

  stage:
    name: Verify both platforms and stage a release
    needs: [arch, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-release
          path: ${{ runner.temp }}/arch-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-release
          path: ${{ runner.temp }}/macos-release
      - name: Stage the release assets and notes
        shell: bash
        run: |
          arch="$RUNNER_TEMP/arch-release"
          release="$RUNNER_TEMP/release"
          python3 packaging/stage-release.py "$GITHUB_SHA" "$VERSION" \
            "$arch" "$RUNNER_TEMP/macos-release" "$release"
          cp "$arch/panora-$GITHUB_SHA.tar.gz" "$release/"
          cp "$arch/RELEASE-RECEIPT.txt" "$release/RELEASE-RECEIPT.arch-x86_64.txt"
          minimum=$(jq -er '.release.minimum_macos' "$release/RELEASE-RECEIPT.macos-arm64.json")
          [[ "$minimum" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          cat > "$release/release-notes.md" <<EOF
          ## Downloads

          - **Omarchy on Arch x86-64.** Install the Arch package with pacman.
          - **Apple silicon preview.** Requires macOS $minimum or newer. The ZIP uses ad-hoc signing and has no Apple notarization. Gatekeeper may block it. The Homebrew formula builds Panora from source.

          Check the SHA-256 list for your platform before installing.
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          compression-level: 0

  draft:
    name: Create GitHub release draft
    needs: stage
    if: inputs.artifact_only == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Upload assets to a draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release"
          package="panora-$VERSION-1-x86_64.pkg.tar.zst"
          source="panora-$GITHUB_SHA.tar.gz"
          macos="panora-v$VERSION-${GITHUB_SHA:0:12}-macos-arm64-adhoc.zip"
          receipt=RELEASE-RECEIPT.arch-x86_64.txt
          grep -Fx "Revision: $GITHUB_SHA" "$receipt"
          grep -Fx "Artifact: $package" "$receipt"
          sha256sum -c SHA256SUMS
          sha256sum -c SHA256SUMS.macos-arm64
          awk -v source="$source" '$2 == source' "$receipt" | sha256sum -c -
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" \
            --jq '.[].ref')
          if grep -Fxq "refs/tags/v$VERSION" <<< "$refs"; then
            echo "The v$VERSION tag already exists." >&2
            exit 1
          fi
          gh release create "v$VERSION" "$package" "$source" SHA256SUMS "$receipt" \
            "$macos" SHA256SUMS.macos-arm64 RELEASE-RECEIPT.macos-arm64.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Panora v$VERSION" --notes-file release-notes.md --generate-notes
