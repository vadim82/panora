name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Native client frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.1"
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - name: Install frontend test dependencies
        run: corepack pnpm install --frozen-lockfile --prod=false
      - name: Check React types, lint, formatting, workflows and build
        run: corepack pnpm check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            ui/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.1"
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - name: Build locked embedded frontend assets
        working-directory: ui
        run: |
          corepack pnpm install --frozen-lockfile --prod=false
          corepack pnpm build
      - name: Test development and packaging tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check formatting
        run: ./tools/check-go-format
      - name: Check module files and downloads
        run: |
          go mod tidy -diff
          go mod verify
          go -C ui mod tidy -diff
          go -C ui mod verify
      - name: Test with race detection
        run: |
          go test -race ./...
          go -C ui test -race ./...
      - name: Vet
        run: |
          go vet ./...
          go -C ui vet ./...
      - name: Build
        run: |
          go build ./...
          go -C ui build ./...
      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Check native Linux client
        if: runner.os == 'Linux'
        run: |
          go -C ui test -race -tags 'wails,production,webkit2_41' ./...
          go -C ui vet -tags 'wails,production,webkit2_41' ./...
          go -C ui build -tags 'wails,production,webkit2_41' -o "$RUNNER_TEMP/panora-ui" .
          help_output=$("$RUNNER_TEMP/panora-ui" --help 2>&1)
          grep -F -- '-socket' <<< "$help_output"
      - name: Build and check the extracted macOS release archive
        if: runner.os == 'macOS'
        run: python3 packaging/macos/build-release.py HEAD 0.0.0 "$RUNNER_TEMP/panora-macos-release"
      - name: Check native macOS client
        if: runner.os == 'macOS'
        run: |
          go -C ui test -race -tags 'wails,production' ./...
          go -C ui vet -tags 'wails,production' ./...

  lint:
    name: Lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CLI and service
            directory: .
          - name: Native bridge
            directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            ui/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.directory }}
          args: --config=${{ github.workspace }}/.golangci.yml
