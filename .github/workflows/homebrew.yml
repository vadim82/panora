name: Homebrew formula

on:
  pull_request:
    paths:
      - "Formula/panora.rb"
      - ".github/workflows/homebrew.yml"
      - "tools/check_macos_bundle.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"
      - name: Install with Homebrew and exercise the installed app
        shell: bash
        run: |
          [[ "$(uname -m)" == arm64 ]]
          brew tap vadim82/panora "$GITHUB_WORKSPACE"
          brew trust --formula vadim82/panora/panora
          brew install --build-from-source panora
          brew test panora
          python3 tools/check_macos_bundle.py "$(brew --prefix panora)/libexec/Panora.app"
      - name: Verify the managed service across a Homebrew upgrade
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(/bin/launchctl managername)" == Aqua ]]
          formula="$(brew --repository vadim82/panora)/Formula/panora.rb"
          registration="$HOME/Library/LaunchAgents/org.panora.service.plist"
          launcher="$(brew --prefix panora)/bin/panora"
          revision="$(git rev-parse HEAD)"

          upgrade_candidate() {
            local tag="$1"
            git tag "$tag" "$revision"
            python3 - "$formula" "$GITHUB_WORKSPACE" "$tag" "$revision" <<'PY'
          import re
          import sys
          from pathlib import Path

          formula, checkout, tag, revision = sys.argv[1:]
          path = Path(formula)
          source = f'url "file://{checkout}/.git",\n      tag:      "{tag}",\n      revision: "{revision}"'
          text, count = re.subn(r'url ".+?",\n\s+tag:.*?\n\s+revision:.*?(?=\n)', source, path.read_text(), count=1)
          if count != 1:
              sys.exit("could not set the candidate formula source")
          path.write_text(text)
          PY
            brew upgrade panora
          }

          wait_for_service() {
            local previous="${1:-}"
            local instance
            for _ in {1..30}; do
              if instance="$(panora status --json 2>/dev/null | jq -er '.instance_id | strings | select(length > 0)')" &&
                 [[ "$instance" != "$previous" ]]; then
                printf '%s\n' "$instance"
                return
              fi
              sleep 1
            done
            return 1
          }

          upgrade_candidate v9998.0.0
          open -g -a "$(brew --prefix panora)/libexec/Panora.app"
          old_instance="$(wait_for_service)"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print ProgramArguments:0' "$registration")" == "$launcher" ]]
          pid="$(launchctl list | awk '$3 == "org.panora.service" { print $1 }')"
          [[ "$pid" =~ ^[0-9]+$ ]]

          # The login preference is independent of whether this job is running.
          python3 - "$registration" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          old = b"<key>RunAtLoad</key><false/>"
          raw = path.read_bytes()
          assert raw.count(old) == 1
          path.write_bytes(raw.replace(old, b"<key>RunAtLoad</key><true/>"))
          PY
          cp "$registration" "$RUNNER_TEMP/panora-upgrade-registration.plist"

          upgrade_candidate v9999.0.0
          brew test panora
          wait_for_service "$old_instance"
          [[ "$(launchctl list | awk '$3 == "org.panora.service" { print $1 }')" == "$pid" ]]
          ps -ww -p "$pid" -o comm= | grep -Fx "$(brew --cellar panora)/9999.0.0/libexec/Panora.app/Contents/MacOS/panora"
          cmp "$registration" "$RUNNER_TEMP/panora-upgrade-registration.plist"

  archive:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the formula's pinned release
        id: source
        shell: bash
        run: |
          [[ "$(uname -m)" == arm64 ]]
          tag=$(sed -nE 's/^ *tag: +"(v[0-9.]+)",$/\1/p' Formula/panora.rb)
          expected=$(sed -nE 's/^ *revision: +"([a-f0-9]+)"$/\1/p' Formula/panora.rb)
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          revision=$(git rev-parse --verify "refs/tags/$tag^{commit}")
          [[ "$revision" == "$expected" ]]
          go_version=$(git show "$revision:go.mod" | sed -nE 's/^go ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
          [[ "$go_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "go-version=$go_version" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.source.outputs.go-version }}
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.1"
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - name: Build and verify an ad-hoc signed archive
        shell: bash
        env:
          VERSION: ${{ steps.source.outputs.version }}
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          output="$RUNNER_TEMP/macos-release"
          python3 packaging/macos/build-release.py "$REVISION" "$VERSION" "$output"
          cd "$output"
          shasum -a 256 -c SHA256SUMS.macos-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panora-v${{ steps.source.outputs.version }}-macos-arm64-adhoc
          path: ${{ runner.temp }}/macos-release
          if-no-files-found: error
          compression-level: 0
